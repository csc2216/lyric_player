<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>歌詞播放器</title>
  <link rel="stylesheet" href="/style.css">
  <!-- installable app (iPad / Android "add to home screen") -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2f6fde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歌詞播放器">
  <script>
    // Apply saved theme / sidebar state before first paint (no flash).
    try {
      const s = JSON.parse(localStorage.getItem("lyricPlayer.settings") || "{}");
      if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
      // narrow screens, and touch screens up to small-laptop width, start with the library collapsed
      const narrow = matchMedia("(max-width: 999px), (pointer: coarse) and (max-width: 1199px)").matches;
      if (s.sidebarCollapsed === true || narrow) document.documentElement.classList.add("sidebar-collapsed");
    } catch {}
  </script>
</head>
<body>
  <div id="mode-banner" class="mode-banner" role="status" hidden></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h1 class="app-title">歌詞播放器</h1>
        <button id="sidebar-toggle" type="button" class="icon sidebar-toggle" title="收合歌曲庫（B）" aria-expanded="true">«</button>
        <!-- narrow screens: compact offline indicator instead of the floating banner -->
        <button id="offline-pill" type="button" class="offline-pill" hidden>離線</button>
      </div>
      <div id="sync-status" class="sync-status" role="status"></div>
      <input id="tree-filter" class="tree-filter" type="search" placeholder="過濾歌手或歌名" autocomplete="off">
      <nav id="tree" class="tree" aria-label="歌曲庫"></nav>
    </aside>

    <section class="center" id="center">
      <div class="center-head">
        <form id="create-form" class="create-form" autocomplete="off">
          <input id="create-input" type="text" placeholder="歌名，或 歌手 - 歌名" required>
          <button id="create-button" type="submit">建立</button>
        </form>
        <div class="settings">
          <button id="settings-button" type="button" class="small" aria-expanded="false" title="設定">⚙</button>
          <div id="settings-panel" class="settings-panel" hidden>
            <label class="check"><input id="set-autoscroll" type="checkbox"> 自動捲動 <kbd>A</kbd></label>
            <fieldset>
              <legend>排版</legend>
              <label><input type="radio" name="layout" value="stacked"> 原文 / 翻譯上下兩行</label>
              <label><input type="radio" name="layout" value="inline"> 原文、翻譯同一行</label>
            </fieldset>
            <fieldset>
              <legend>主題</legend>
              <label><input type="radio" name="theme" value="auto"> 跟隨系統</label>
              <label><input type="radio" name="theme" value="light"> 淺色</label>
              <label><input type="radio" name="theme" value="dark"> 深色</label>
            </fieldset>
            <label class="field-inline">點行時提早 <input id="set-preroll" type="number" min="0" max="2" step="0.05"> 秒開始</label>
            <p class="hint">快捷鍵：Space 播放/暫停 · ←/→ 上/下一行 · [ / ] offset ∓100ms（加 Shift ∓1 秒）· Shift+S 校準時間 · C 回到目前歌詞 · A 自動捲動 · B 收合歌曲庫</p>
          </div>
        </div>
      </div>
      <div id="build-quota" class="build-quota" hidden></div>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <div id="song-area" class="song-area" hidden>
        <div class="player-box">
          <div id="player"></div>
          <button id="expand-close" type="button" class="expand-close">還原 <kbd>Esc</kbd></button>
        </div>
        <div class="song-heading">
          <span id="song-title" class="song-title"></span>
          <span id="song-meta" class="song-meta"></span>
        </div>
        <div class="song-tools">
          <button id="calibrate-button" type="button" class="small" title="Shift+S">校準時間</button>
          <button id="tap-button" type="button" class="small" hidden>打點同步</button>
          <span class="offset-ctl" title="歌詞時間偏移（[ / ] 鍵調整，加 Shift 一次 1 秒）">
            <button id="offset-minus" type="button" class="small" title="歌詞提早 100ms（[）">−</button>
            <span id="offset-value" class="offset-value">0 ms</span>
            <button id="offset-plus" type="button" class="small" title="歌詞延後 100ms（]）">+</button>
          </span>
          <span class="volume-ctl" title="音量（YouTube 播放器較小時，它自己的音量條很難拉）">
            <button id="mute-button" type="button" class="icon" aria-label="靜音 / 取消靜音">🔊</button>
            <input id="volume-slider" type="range" min="0" max="100" step="1" aria-label="音量">
          </span>
          <button id="video-button" type="button" class="small">換影片</button>
          <button id="info-button" type="button" class="small">編輯資訊</button>
          <button id="retranslate-all-button" type="button" class="small">全部重翻</button>
          <button id="delete-button" type="button" class="small danger">刪除</button>
          <button id="expand-button" type="button" class="small">放大影片</button>
        </div>
        <p id="song-notice" class="song-notice" hidden></p>
        <div id="calib-panel" class="calib-panel" hidden></div>
        <div id="tap-panel" class="calib-panel" hidden></div>
        <div id="song-panel" class="song-panel" hidden></div>
      </div>
    </section>

    <main class="lyrics-col" id="lyrics-col">
      <section id="candidates" class="candidates" hidden></section>
      <section id="welcome" class="welcome">
        <p>從左側選一首歌，或在中間輸入歌名建立新歌。</p>
        <p class="hint">點歌詞任一行從那裡開始播；空白鍵播放 / 暫停；雙擊翻譯可以修改。</p>
      </section>
      <div id="lyrics" class="lyrics"></div>
      <div class="jump-anchor">
        <div class="float-stack">
          <button id="jump-button" type="button" class="jump-button" hidden>回到目前歌詞 <kbd>C</kbd></button>
          <!-- touch screens only (CSS): big play / previous / next buttons -->
          <div id="touch-controls" class="touch-controls" role="toolbar" aria-label="播放控制">
            <button id="touch-prev" type="button" aria-label="上一行">⏮</button>
            <button id="touch-play" type="button" aria-label="播放 / 暫停">▶</button>
            <button id="touch-next" type="button" aria-label="下一行">⏭</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="pin-dialog" class="pin-dialog">
    <form id="pin-form" method="dialog">
      <h2>歌詞播放器</h2>
      <p>請輸入主人給你的 PIN 碼。</p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" required>
      <p id="pin-error" class="pin-error" hidden></p>
      <button type="submit">進入</button>
    </form>
  </dialog>
  <div id="blocked" class="blocked" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
